<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<title>Corpus Glandula — Class 10 (CBSE)</title>
<link rel="stylesheet" href="css/style.css" data-inline>
</head>
<body>
<div id="tabbar"></div>
<div id="tabviews">
<div id="view-home" class="active"><div id="app">
  <aside id="panel">
    <div class="titleRow"><div class="titleMark"><svg viewBox="0 0 20 20" fill="none" stroke="#eafcff" stroke-width="1.5" stroke-linecap="round"><line x1="10" y1="6.2" x2="5" y2="14.2"></line><line x1="10" y1="6.2" x2="15" y2="14.2"></line><line x1="5" y1="14.2" x2="15" y2="14.2"></line><circle cx="10" cy="6.2" r="2.3" fill="#eafcff" stroke="none"></circle><circle cx="5" cy="14.2" r="1.7" fill="#eafcff" stroke="none"></circle><circle cx="15" cy="14.2" r="1.7" fill="#eafcff" stroke="none"></circle></svg></div><div class="titleText"><h1>Corpus Glandula</h1><div class="titleSub">Endocrine System Simulator</div></div></div>
    <div class="block">
      <div class="lblRow">
        <div class="lbl">Biological Sex</div>
        <div class="saveRow">
          <button class="saveBtn" id="exportBtn" title="Save HTML snapshot (opens with your images and current view)" aria-label="Save HTML snapshot">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6l-4 4 4 4"></path><path d="M13 6l4 4-4 4"></path><path d="M11.2 4.5l-2.4 11"></path></svg>
          </button>
          <button class="saveBtn" id="jsonBtn" title="Save settings as JSON (image links + current view)" aria-label="Save settings as JSON">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 3.5H7a2 2 0 0 0-2 2v2.7a1.8 1.8 0 0 1-1.8 1.8 1.8 1.8 0 0 1 1.8 1.8v2.7a2 2 0 0 0 2 2h.5"></path><path d="M12.5 3.5h.5a2 2 0 0 1 2 2v2.7a1.8 1.8 0 0 0 1.8 1.8 1.8 1.8 0 0 0-1.8 1.8v2.7a2 2 0 0 1-2 2h-.5"></path></svg>
          </button>
          <button class="saveBtn" id="infoBtn" title="Credits" aria-label="Credits" aria-expanded="false" aria-controls="creditsCard">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10" cy="10" r="7.2"></circle><path d="M10 9v5"></path><circle cx="10" cy="6.3" r="0.4" fill="currentColor"></circle></svg>
          </button>
        </div>
      </div>
      <div class="sexRow" id="sexSeg">
        <button data-sex="male" class="sexbtn on" aria-label="Male" title="Male">
          <svg viewBox="0 0 20 20"><circle cx="8" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.7"></circle><line x1="12.4" y1="7.6" x2="17" y2="3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></line><path d="M12.3 3 H17 V7.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"></path></svg>
        </button>
        <button data-sex="female" class="sexbtn" aria-label="Female" title="Female">
          <svg viewBox="0 0 20 20"><circle cx="10" cy="7.5" r="6" fill="none" stroke="currentColor" stroke-width="1.7"></circle><line x1="10" y1="13.5" x2="10" y2="18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></line><line x1="6.3" y1="16" x2="13.7" y2="16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></line></svg>
        </button>
      </div>
    </div>
    
    <div class="credits" id="creditsCard" hidden></div>
    <div class="block" style="padding-bottom:4px;"><div class="lbl">Glands (tap to zoom)</div></div>
    <div id="list"></div>
  </aside>
  <main id="stage">
    <canvas id="view"></canvas>
    <div id="tip"></div>
    <div id="orgCard"></div>
    <div id="hint">Drag to rotate · scroll to zoom · click a gland</div>
    <div id="viewRail">
      <button class="railbtn active" id="spinBtn" title="Auto-rotate" aria-label="Auto-rotate">
        <svg class="bicon" viewBox="0 0 20 20">
          <g stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3 A7 7 0 0 1 17 10"></path><path d="M17 10 l-2.3 -0.4 M17 10 l-0.9 -2.1"></path>
          </g>
          <g stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(90 10 10)">
            <path d="M10 3 A7 7 0 0 1 17 10"></path><path d="M17 10 l-2.3 -0.4 M17 10 l-0.9 -2.1"></path>
          </g>
          <g stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180 10 10)">
            <path d="M10 3 A7 7 0 0 1 17 10"></path><path d="M17 10 l-2.3 -0.4 M17 10 l-0.9 -2.1"></path>
          </g>
          <g stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="rotate(270 10 10)">
            <path d="M10 3 A7 7 0 0 1 17 10"></path><path d="M17 10 l-2.3 -0.4 M17 10 l-0.9 -2.1"></path>
          </g>
        </svg>
      </button>
      <button class="railbtn" id="resetBtn" title="Reset view" aria-label="Reset view">
        <svg class="bicon" viewBox="0 0 20 20" fill="none" stroke="currentColor">
          <path d="M15.6 6.3 A7 7 0 1 1 12.8 3.6" stroke-width="1.7" stroke-linecap="round"></path>
          <path d="M12.6 1.2 L12.8 3.9 L15.6 3.7" fill="none" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"></path>
        </svg>
      </button>
      <button class="railbtn" id="xrayBtn" title="X-Ray view" aria-label="X-Ray view">
        <svg class="bicon" viewBox="0 0 20 20" fill="currentColor">
          <rect x="5.5" y="8.7" width="9" height="2.6" rx="1.3"></rect>
          <circle cx="4.3" cy="7" r="2.3"></circle>
          <circle cx="4.3" cy="13" r="2.3"></circle>
          <circle cx="15.7" cy="7" r="2.3"></circle>
          <circle cx="15.7" cy="13" r="2.3"></circle>
        </svg>
      </button>
    </div>
    
  </main>
</div></div>
<div id="panels"></div>
</div>
<script src="js/models.js" data-inline></script>
<script src="js/app.js" data-inline></script></body></html>
